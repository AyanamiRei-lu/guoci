# 版本目录 —— 为什么是这几个版本
#
# AGP 9.3.0 + Gradle 9.5.0 是本机已验证可用的组合（Android SDK 在 D:\asdk，
# platform 37 + build-tools 37.0.0）。不要随意升级其中任何一个：AGP 9 换掉了
# 两处 DSL 写法（compileSdk {} 与 buildTypes{ release { optimization {} } }），
# 升级会让 app/build.gradle.kts 里的写法失效。
#
# 这里没有 org.jetbrains.kotlin.android：AGP 9 内置 Kotlin 支持，再应用它会直接
# 报错 "The 'org.jetbrains.kotlin.android' plugin is no longer required for Kotlin
# support since AGP 9.0"。但 Compose 编译器插件仍然必须显式应用。

[versions]
agp = "9.3.0"
kotlinCompose = "2.4.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
junit = "4.13.2"

[libraries]
# Compose 各构件版本由 BOM 统一钉住，下列条目故意不带版本号，避免彼此漂移。
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinCompose" }
# 注意：:core 应用 org.jetbrains.kotlin.jvm 时**不带版本**，所以这里没有条目。
# AGP 9 已经把 Kotlin Gradle 插件放进构建 classpath，指定版本会报
# "already on the classpath with an unknown version"。
